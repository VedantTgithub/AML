networks:
  clarity-network:
    driver: bridge

volumes:
  kafka-data:
  zookeeper-data:
  airflow-postgres-data:    # ← add this
  airflow-logs:             # ← add this

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: clarity-zookeeper
    networks:
      - clarity-network
    env_file:
      - ../../.env.dev
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: clarity-kafka
    networks:
      - clarity-network
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    env_file:
      - ../../.env.dev
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://clarity-kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: clarity-kafka-ui
    networks:
      - clarity-network
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    env_file:
      - ../../.env.dev
    environment:
      KAFKA_CLUSTERS_0_NAME: clarity-dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: clarity-kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: clarity-schema-registry
    networks:
      - clarity-network
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    env_file:
      - ../../.env.dev
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: clarity-kafka:29092

    # ─── AIRFLOW POSTGRES (metadata DB) ─────────────────────────
  airflow-postgres:
    image: postgres:15
    container_name: clarity-airflow-postgres
    networks:
      - clarity-network
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data

  # ─── AIRFLOW WEBSERVER ───────────────────────────────────────
  airflow-webserver:
    image: apache/airflow:2.8.0
    container_name: clarity-airflow-webserver
    env_file:
      - ../../airflow/airflow.env
    networks:
      - clarity-network
    depends_on:
      - airflow-postgres
    ports:
      - "8083:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__WEBSERVER__SECRET_KEY: clarity-aml-secret-key
    volumes:
      - ../../airflow/dags:/opt/airflow/dags
      - ../../airflow/plugins:/opt/airflow/plugins
      - airflow-logs:/opt/airflow/logs
    command: webserver

  # ─── AIRFLOW SCHEDULER ───────────────────────────────────────
  airflow-scheduler:
    image: apache/airflow:2.8.0
    container_name: clarity-airflow-scheduler
    env_file:
      - ../../airflow/airflow.env
    networks:
      - clarity-network
    depends_on:
      - airflow-postgres
      - airflow-webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__WEBSERVER__SECRET_KEY: clarity-aml-secret-key
    volumes:
      - ../../airflow/dags:/opt/airflow/dags
      - ../../airflow/plugins:/opt/airflow/plugins
      - airflow-logs:/opt/airflow/logs
    command: scheduler

  # ─── AIRFLOW INIT (runs once to set up DB) ───────────────────
  airflow-init:
    image: apache/airflow:2.8.0
    container_name: clarity-airflow-init
    networks:
      - clarity-network
    depends_on:
      - airflow-postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: clarity-aml-secret-key
    command: >
      bash -c "
        airflow db init &&
        airflow users create
          --username admin
          --password admin
          --firstname Admin
          --lastname User
          --role Admin
          --email admin@clarity-aml.com
      "  

      